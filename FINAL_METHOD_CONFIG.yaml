  notes: "Documentation claims k=4. However, the inference pipeline and training pipeline explicitly use k=6. Baseline Random Forest (kmer_ml.py) uses k=4."

deterministic_kmer:
  value: 21
  provenance: "app.py -> KMER_K = 21"
  status: "FROZEN"

deterministic_similarity:
  value: "Asymmetric Containment"
  formula: "len(A & B) / len(A)"
  provenance: "app.py -> jaccard() implementation"
  status: "CONTRADICTION"
  notes: "Documentation calls it Jaccard (intersection over union), but code calculates intersection over length of query (containment)."

